<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>srds console</title>
<style>
/* ---- idlefree console shell: the same block on every console (s3rds, dynamoredis, s3shift, lambdaflow); the look of s3keepass ---- */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --panel2: #f9fafb; --line: #e5e7eb; --line2: #d1d5db;
  --text: #111827; --muted: #6b7280; --faint: #9ca3af;
  --accent: #2563eb; --accent-bg: #dbeafe; --accent-text: #1e40af;
  --ok: #059669; --err: #dc2626; --err-bg: #fef2f2;
  --bar: #1f2937; --bar-text: #f9fafb; --bar-muted: #9ca3af;
  --code-bg: #111827; --code-text: #d1d5db; --code-sql: #93c5fd; --code-ok: #86efac; --code-err: #fca5a5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f17; --panel: #111827; --panel2: #0f1623; --line: #1f2937; --line2: #374151;
    --text: #e5e7eb; --muted: #9ca3af; --faint: #6b7280;
    --accent: #3b82f6; --accent-bg: #1e3a8a; --accent-text: #dbeafe; --err-bg: #2a1215;
    --bar: #030712; --code-bg: #030712;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 34px; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: var(--accent); }
/* top bar: name, where it runs, sign out */
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 16px; min-height: 52px;
  background: var(--bar); color: var(--bar-text); }
.brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .logo { width: 30px; height: 30px; border-radius: 7px; background: #2b2d31; display: grid; place-items: center; font-size: 16px; }
.bar .meta { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.bar .k { color: var(--bar-muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.bar .chip { font: 12px var(--mono); color: var(--bar-text); background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
.bar .spacer { flex: 1; }
.tb { background: transparent; border: 1px solid transparent; color: var(--bar-text); border-radius: 6px; padding: 5px 9px;
  cursor: pointer; font-size: 13px; white-space: nowrap; text-decoration: none; }
.tb:hover { background: rgba(255,255,255,.1); }
.tb.on { background: rgba(255,255,255,.14); }
.page { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
/* buttons: blue = the main action, outlined = the rest, red text = removes something */
.btn { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel); color: var(--text);
  cursor: pointer; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary, .btn-secondary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled), .btn-secondary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
.btn-danger { padding: 3px 9px; font-size: 12px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel);
  color: var(--err); cursor: pointer; }
.btn-danger:hover { border-color: var(--err); background: var(--err-bg); }
.btn-small { padding: 3px 9px; font-size: 12px; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 10px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
/* panels and text */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.section-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.code { width: 100%; min-height: 90px; resize: vertical; font: 13px/1.5 var(--mono); padding: 8px 10px; }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
/* tables: a quiet header row, numbers line up, wide results scroll inside their own frame */
.grid-wrap { overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { min-width: 100%; border-collapse: separate; border-spacing: 0; }
th { position: sticky; top: 0; z-index: 1; background: var(--panel2); color: var(--muted); font-size: 12px; font-weight: 600;
  text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td { padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; line-height: 1.45;
  font-variant-numeric: tabular-nums; white-space: normal; overflow-wrap: anywhere; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--panel2); }
td.null { color: var(--faint); font-style: italic; }
td input { width: 100%; min-width: 80px; padding: 4px 8px; font-size: 13px; }
/* the latest run's result or error, right under the box that ran it */
.out { margin-top: 10px; padding: 8px 12px; border-radius: 6px; background: var(--code-bg); color: var(--code-text);
  font: 12px/1.7 var(--mono); white-space: pre-wrap; max-height: 240px; overflow: auto; }
.out:empty { display: none; }
.out .sql, .history .sql { color: var(--code-sql); } .out .ok, .history .ok { color: var(--code-ok); }
.out .err, .history .err { color: var(--code-err); }
/* status bar: the last call; click for this session's history; the version links to the changelog */
.status { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 12px; align-items: center;
  padding: 4px 16px; min-height: 26px; font: 12px var(--mono); color: var(--muted); background: var(--panel);
  border-top: 1px solid var(--line); cursor: pointer; }
.status .last { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .last.ok { color: var(--ok); } .status .last.err { color: var(--err); }
.status .ver { color: var(--accent); white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
.history { position: fixed; left: 0; right: 0; bottom: 26px; z-index: 5; max-height: 40vh; overflow: auto; padding: 8px 16px;
  background: var(--code-bg); color: var(--code-text); font: 12px/1.7 var(--mono); white-space: pre-wrap; border-top: 1px solid var(--line2); }
.history .sep { border-top: 1px dashed #4b5563; margin: 6px 0; }
/* dialogs */
dialog { border: none; border-radius: 12px; padding: 22px 24px; width: 440px; max-width: calc(100vw - 32px);
  background: var(--panel); color: var(--text); box-shadow: 0 24px 64px rgba(0,0,0,.35); position: fixed; inset: 0; margin: auto; }
dialog::backdrop { background: rgba(15,23,42,.55); }
dialog h3 { font-size: 17px; margin-bottom: 6px; }
.form-grid { display: grid; gap: 12px; margin: 8px 0 4px; }
.form-field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.form-field input { width: 100%; padding: 8px 10px; }
.form-field small { color: var(--faint); font-size: 12px; }
dialog .actions { flex-direction: row-reverse; justify-content: flex-start; margin-top: 16px; }   /* OK first in the form (Enter), shown on the right */
/* ---- end idlefree console shell ---- */

/* ---- s3rds ---- */
#info-db { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.controls label { font-size: 12px; font-weight: 600; color: var(--muted); }
.controls select { min-width: 160px; }
.table-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.table-name { font-size: 16px; font-weight: 600; }
.row-count { font-size: 12px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.grid-wrap + .section-title, .grid-wrap + .pagination { margin-top: 14px; }
/* the schema panel: its own tinted box above the rows, so it reads as a separate thing */
.schema-box { background: var(--accent-bg); border: 1px solid var(--accent); border-radius: 8px; padding: 12px; }
.schema-title { font-size: 15px; color: var(--accent-text); }
.schema-title .spacer { flex: 1; }
#schema.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); }
/* drag a header's right edge to set the column width; double-click the edge to make it automatic again */
.col-resize { position: absolute; top: 0; right: 0; width: 7px; height: 100%; cursor: col-resize; }
.col-resize:hover { background: var(--accent-bg); }
body.resizing { cursor: col-resize; user-select: none; }
td { max-width: 280px; }
td.rownum, th.rownum { color: var(--faint); text-align: right; min-width: 36px; background: var(--panel2); }
.pagination { display: flex; gap: 8px; justify-content: center; align-items: center; }
.pagination button, .pagination span { padding: 5px 12px; border-radius: 6px; font-size: 13px; background: var(--panel); border: 1px solid var(--line2); }
.pagination button { cursor: pointer; }
.pagination button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pagination button:disabled { opacity: .5; cursor: default; }
.pagination .current { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
</style>
</head>
<body>
<header class="bar">
  <span class="brand"><span class="logo">📊</span>s3rds console</span>
  <span class="meta"><span class="k">Endpoint</span><span class="chip" id="info-host">-</span></span>
  <span class="meta"><span class="k">Database</span><span class="chip" id="info-db">-</span></span>
  <span class="spacer"></span>
  <button class="tb" id="logout">Sign out</button>
</header>

<div class="page">
  <div class="controls">
    <label for="dbs">Database</label><select id="dbs"></select>
    <button class="btn btn-secondary" id="newdb">+ New database</button>
    <label for="tables">Table</label><select id="tables"></select>
    <button class="btn btn-secondary" id="newtable">+ New table</button>
    <button class="btn" id="refresh">Refresh</button>
    <button class="btn" id="schema" disabled>Schema</button>
  </div>
  <div id="schemapanel" hidden></div>

  <div class="panel">
    <div class="section-title"><label for="sql">SQL</label></div>
    <textarea id="sql" class="code" placeholder="One statement at a time, e.g. CREATE TABLE notes (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL) STRICT"></textarea>
    <div class="actions">
      <button class="btn btn-primary" id="run">▶ Run</button>
      <span class="hint">⌘/Ctrl+Enter runs · an empty field = NULL</span>
    </div>
    <div class="out" id="log"></div>
    <div id="sqlout" class="grid-wrap" style="margin-top:12px" hidden><table id="sqlgrid"></table></div>
  </div>

  <div id="main"></div>
</div>

<div class="history" id="history" hidden></div>
<footer class="status" id="status" title="Click: this session's calls">
  <span class="last" id="last">ready</span>
  <a class="ver" href="https://github.com/cloudformer/s3rds/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer"
     title="What changed in each release">s3rds __VERSION__</a>
</footer>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgtitle"></h3>
    <div class="form-grid" id="dlgbody"></div>
    <div class="actions">
      <button class="btn btn-primary" value="ok">OK</button>
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const state = {db:null, table:null, tables:[], loaded:false, offset:0, limit:50, total:0,
               columns:[], rows:[], structure:[], schema:false};  // schema: the structure panel is open
// the browser keeps only the credential, the last database/table and column widths (data is always fetched)
const store = {
  get: k => { try { return localStorage.getItem('srds_' + k); } catch(e){ return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem('srds_' + k)
                                   : localStorage.setItem('srds_' + k, v); } catch(e){} },
};
let cred = store.get('cred') || '';

$('#info-host').textContent = location.host;

function saveCred(c){ cred = c; store.set('cred', c || null); }

// in-page modal: dialog('title', [{key,label,type,placeholder,value}]) -> {key: value} or null (cancelled)
function dialog(title, fields){
  return new Promise(resolve => {
    $('#dlgtitle').textContent = title;
    $('#dlgbody').innerHTML = (fields || []).map(f => `<div class="form-field">
      <label>${esc(f.label)}</label>
      <input name="${esc(f.key)}" type="${f.type || 'text'}"
             placeholder="${esc(f.placeholder || '')}" value="${esc(f.value || '')}">
    </div>`).join('');
    const dlg = $('#dlg');
    dlg.returnValue = 'cancel';
    dlg.onclose = () => {
      if (dlg.returnValue !== 'ok') return resolve(null);
      const out = {};
      $('#dlgbody').querySelectorAll('input').forEach(i => out[i.name] = i.value.trim());
      resolve(out);
    };
    dlg.showModal();
    const first = $('#dlgbody input');
    if (first) first.focus();
  });
}

async function askCred(){
  const v = await dialog('Sign in', [
    {key:'u', label:'user', placeholder:'user'},
    {key:'p', label:'password', type:'password'},
  ]);
  if (v) saveCred(v.u + ':' + v.p);
}
// ---- output log: every run echoes "db> SQL", then a timestamped result line ----
function ts(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtMs(ms){
  ms = Math.max(0, Math.round(ms));
  return ms >= 1000 ? `${Math.floor(ms/1000)} s ${ms%1000} ms` : `${ms} ms`;
}
// one run = one group (SQL line + result line): the latest shows under the SQL box and in the status bar;
// a click on the status bar opens this session's history, newest first (open or closed is remembered)
const logGroups = [];
let historyOpen = store.get('history') === '1';
function logStart(){
  logGroups.push([]);
  if (logGroups.length > 300) logGroups.shift();
}
function log(text, cls){
  if (!logGroups.length) logStart();
  logGroups[logGroups.length - 1].push({text, cls});
  renderLog();
}
function renderLog(){
  const line = l => Object.assign(document.createElement('div'), {className: l.cls || '', textContent: l.text});
  const latest = logGroups[logGroups.length - 1] || [];
  $('#log').replaceChildren(...latest.map(line));
  const last = latest[latest.length - 1];
  $('#last').textContent = last ? last.text : 'ready';
  $('#last').className = 'last ' + (last && last.cls || '');
  const h = $('#history');
  h.hidden = !historyOpen;
  if (historyOpen){
    h.replaceChildren(...logGroups.slice().reverse().flatMap((g, i) =>
      (i ? [Object.assign(document.createElement('div'), {className: 'sep'})] : []).concat(g.map(line))));
    if (!logGroups.length) h.textContent = 'No calls yet in this session.';
    h.scrollTop = 0;
  }
}
function logSql(sql){ logStart(); log(`${state.db}> ${sql.replace(/\s+/g, ' ').trim()}`, 'sql'); }
function msg(t, ok){ if (t) log(`[${ts()}] ${t}`, ok ? 'ok' : 'err'); }
// total = round trip seen by the browser; execution = server time; fetching = the difference (network + transfer)
function timing(d){
  const total = d._total || 0, exec = d.ms || 0;
  return `in ${fmtMs(total)} (execution: ${fmtMs(exec)}, fetching: ${fmtMs(total - exec)}) · ${d.s3}`;
}
function rowsLine(d){ return `${d.rows.length} rows retrieved ${timing(d)}`; }
function doneLine(d){ return `${d.rowcount >= 0 ? d.rowcount + ' rows affected' : 'completed'} ${timing(d)}`; }
function esc(s){ return String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cell(v){
  if (v === null) return '<td class="null">NULL</td>';
  const t = typeof v === 'object' ? JSON.stringify(v) : String(v);
  return `<td title="${esc(t)}">${esc(t)}</td>`;
}
function sqlStr(v){ return v === null ? 'NULL' : "'" + String(v).replace(/'/g, "''") + "'"; }
function friendly(m){
  if (/incomplete input/.test(m))
    return m + ' ← incomplete statement: CREATE TABLE needs column definitions, e.g. CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT)';
  if (/syntax error/.test(m))
    return m + ' ← SQL syntax error; the console runs one statement at a time';
  if (/no such table/.test(m))
    return m + ' ← no such table: create it first, or check the selected database';
  if (/no such column/.test(m))
    return m + ' ← no such column: ALTER TABLE ... ADD COLUMN in the SQL box';
  if (/NOT NULL constraint/.test(m))
    return m + ' ← a NOT NULL column was left empty';
  if (/unknown datatype/.test(m))
    return m + ' ← STRICT tables allow only INTEGER / REAL / TEXT / BLOB / ANY';
  if (/FOREIGN KEY constraint/.test(m))
    return m + ' ← foreign key violation: the parent row does not exist, or is still referenced';
  if (/read-only endpoint/.test(m))
    return m + ' ← this is the read-only endpoint; open the console on the write endpoint (db_url) to change data';
  if (/write conflict/.test(m))
    return m + ' ← this write did not land; refresh and retry';
  return m;
}

async function api(path, opts = {}){
  if (!cred) await askCred();
  if (!cred) throw new Error('sign-in cancelled');
  const t0 = performance.now();
  const r = await fetch(path, Object.assign({}, opts, {
    headers: {'content-type':'application/json', 'authorization': 'Basic ' + btoa(cred)}}));
  let data = {}; try { data = await r.json(); } catch(e) {}
  if (r.status === 401){ saveCred(''); throw new Error('wrong user or password; the next action asks again'); }
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  data._total = performance.now() - t0;
  return data;
}

// databases and tables load automatically and restore the last selection; rows load on demand (button or table change)
async function loadDbs(keep){
  const d = await api('/api/databases');
  const want = keep || store.get('db');
  $('#dbs').innerHTML = '<option value="">-- database --</option>'
    + d.databases.map(n => `<option>${esc(n)}</option>`).join('');
  state.db = d.databases.includes(want) ? want : null;
  $('#dbs').value = state.db || '';
  store.set('db', state.db);
  await loadTables();
}
async function loadTables(keep){
  const wasLoaded = state.loaded && keep && keep === state.table;
  if (!keep || keep !== state.table) state.schema = false;  // the panel stays open only on the same table
  state.table = null; state.tables = []; state.loaded = false; state.offset = 0;
  $('#tables').innerHTML = '<option value="">-- table --</option>';
  if (state.db){
    const d = await api(`/api/db/${state.db}/tables`);
    state.tables = d.tables;
    $('#tables').innerHTML += d.tables.map(n => `<option>${esc(n)}</option>`).join('');
    const want = keep || store.get('table:' + state.db);
    state.table = d.tables.includes(want) ? want : null;
    $('#tables').value = state.table || '';
    store.set('table:' + state.db, state.table);
  }
  if (!wasLoaded && state.schema && state.table) await loadStructure();  // an open panel shows the structure after DDL
  if (wasLoaded) await loadRows(); else render();  // refresh only if rows were showing (e.g. after DDL)
}
async function loadRows(){
  if (!state.table){ render(); return; }
  const d = await api(
    `/api/db/${state.db}/table/${state.table}?limit=${state.limit}&offset=${state.offset}`);
  Object.assign(state, {columns:d.columns, rows:d.rows, total:d.total,
                        structure:d.structure || [], ms:d.ms, s3:d.s3, loaded:true});
  render();
}
// the schema panel without the rows: the same call with one row, only its structure kept
async function loadStructure(){
  const d = await api(`/api/db/${state.db}/table/${state.table}?limit=1&offset=0`);
  state.structure = d.structure || [];
}

function isAutoPk(col){ return col.pk && /^INTEGER$/i.test(col.type || ''); }

// structure (like DESCRIBE), each column with rename / drop; shown only while the schema panel is open
function schemaSection(){
  if (!state.schema) return '';
  const structRows = state.structure.map((c, i) => `<tr>
      <td><strong>${esc(c.name)}</strong></td>
      <td>${esc(c.type || '-')}</td>
      <td>${c.notnull ? 'NO' : 'YES'}</td>
      <td>${c.pk ? 'PRI' : '-'}</td>
      <td>${c.dflt_value === null ? '-' : esc(c.dflt_value)}</td>
      <td>${isAutoPk(c) ? 'auto_increment' : '-'}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-small" onclick="renameCol(${i})">rename</button>
        ${c.pk ? '' : `<button class="btn-danger" onclick="dropCol(${i})">drop</button>`}
      </td>
    </tr>`).join('');
  return `
    <div class="schema-box">
      <div class="section-title schema-title">🧱 Schema <span class="hint">${state.structure.length} columns</span>
        <span class="spacer"></span>
        <button class="btn btn-secondary btn-small" id="addcol">+ Add column</button>
      </div>
      <div class="grid-wrap"><table>
        <thead><tr><th>Field</th><th>Type</th><th>Null</th><th>Key</th><th>Default</th><th>Extra</th><th>actions</th></tr></thead>
        <tbody>${structRows}</tbody>
      </table></div>
    </div>`;
}

function render(){
  $('#info-db').textContent = state.db || '-';
  $('#schema').disabled = !state.table;
  $('#schema').textContent = state.schema ? 'Hide schema' : 'Schema';
  $('#schema').classList.toggle('on', state.schema);
  // the structure panel sits right under the Schema button; closed = gone, nothing to scroll to
  $('#schemapanel').innerHTML = state.table ? schemaSection() : '';
  $('#schemapanel').hidden = !(state.schema && state.table);
  if (state.schema && state.table) $('#addcol').onclick = addCol;
  const main = $('#main');
  if (!state.db){
    main.innerHTML = '<div class="panel"><div class="empty">Pick a database above, or click “+ New database”</div></div>';
    return;
  }
  if (!state.table){
    main.innerHTML = `<div class="panel"><div class="empty">${state.tables.length
      ? 'Pick a table above'
      : 'No tables yet — click “+ New table”, or write CREATE TABLE in the SQL box'}</div></div>`;
    return;
  }
  if (!state.loaded){
    main.innerHTML = `<div class="panel">
      <div class="table-header"><div class="table-name">📋 ${esc(state.table)}</div></div>
      <div class="empty">Rows are not loaded automatically.
        <button class="btn btn-primary" id="loadbtn" style="margin-left:10px">Load rows</button>
      </div></div>`;
    $('#loadbtn').onclick = () => loadRows().catch(e => msg(friendly(e.message)));
    return;
  }
  const hasRowid = state.columns[0] === '_rowid_';
  const pages = Math.max(1, Math.ceil(state.total / state.limit));
  const page = Math.floor(state.offset / state.limit) + 1;

  // data grid
  const dataHead = '<tr>' + state.columns.map(colTh).join('')
    + (hasRowid ? '<th>actions</th>' : '') + '</tr>';
  const dataRows = state.rows.map((r, i) =>
    `<tr data-i="${i}">` + r.map(cell).join('')
    + (hasRowid
      ? `<td style="white-space:nowrap"><button class="btn btn-small" onclick="editRow(${i})">edit</button>
         <button class="btn-danger" onclick="delRow(${i})">🗑 delete</button></td>` : '')
    + '</tr>').join('');

  main.innerHTML = `
  <div class="panel">
    <div class="table-header">
      <div class="table-name">📋 ${esc(state.table)}</div>
      <div style="display:flex; gap:10px; align-items:center">
        <div class="row-count">${state.total} rows</div>
        <button class="btn btn-secondary btn-small" id="addrow">+ Insert row</button>
      </div>
    </div>

    <div class="section-title">Rows (page ${page} / ${pages})
      ${state.ms !== undefined ? `<span class="hint">${state.ms} ms · ${state.s3}</span>` : ''}
    </div>
    ${state.rows.length
      ? `<div class="grid-wrap"><table id="grid"><thead>${dataHead}</thead><tbody>${dataRows}</tbody></table></div>`
      : '<div class="empty">No rows yet — insert the first one with “+ Insert row”</div>'}

    <div class="pagination">
      <button id="prev" ${state.offset <= 0 ? 'disabled' : ''}>← prev</button>
      <span class="current">${page} / ${pages}</span>
      <button id="next" ${state.offset + state.limit >= state.total ? 'disabled' : ''}>next →</button>
    </div>
  </div>`;

  if ($('#grid')) applyWidths($('#grid'));
  $('#addrow').onclick = addRow;
  $('#prev').onclick = () => { state.offset = Math.max(0, state.offset - state.limit);
    loadRows().catch(e => msg(friendly(e.message))); };
  $('#next').onclick = () => { state.offset += state.limit;
    loadRows().catch(e => msg(friendly(e.message))); };
}

// column widths: set by dragging, kept per table (and for the SQL result) in this browser
const colWidths = (() => { try { return JSON.parse(store.get('colw')) || {}; } catch(e){ return {}; } })();   // "<db>.<table>" or "sql" -> {column: px}
function saveWidths(){ store.set('colw', JSON.stringify(colWidths)); }
function colTh(c){ return `<th data-col="${esc(c)}" title="${esc(c)}">${esc(c)}<span class="col-resize"></span></th>`; }
function gridKey(t){ return t.id === 'grid' ? `${state.db}.${state.table}` : 'sql'; }
function applyWidths(t){
  const w = colWidths[gridKey(t)] || {};
  t.querySelectorAll('thead th').forEach((th, i) => {
    const css = th.dataset.col in w ? w[th.dataset.col] + 'px' : '';
    for (const c of [th, ...t.querySelectorAll(`tbody td:nth-child(${i + 1})`)])
      c.style.width = c.style.minWidth = c.style.maxWidth = css;
  });
}
document.addEventListener('mousedown', e => {
  const h = e.target.closest('.col-resize');
  if (!h) return;
  e.preventDefault();
  const th = h.parentElement, t = th.closest('table'), key = gridKey(t), cs = getComputedStyle(th);
  const x0 = e.clientX, w0 = th.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const move = ev => { (colWidths[key] ||= {})[th.dataset.col] = Math.max(40, Math.round(w0 + ev.clientX - x0)); applyWidths(t); };
  const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
                     document.body.classList.remove('resizing'); saveWidths(); };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
  document.body.classList.add('resizing');
});
document.addEventListener('dblclick', e => {
  const h = e.target.closest('.col-resize');
  if (!h) return;
  const th = h.parentElement, t = th.closest('table');
  delete (colWidths[gridKey(t)] || {})[th.dataset.col];
  applyWidths(t);
  saveWidths();
});

async function runWrite(sql){
  logSql(sql);
  try {
    const d = await api(`/api/db/${state.db}/query`, {method:'POST', body: JSON.stringify({sql})});
    msg(doneLine(d), true);
    await loadRows();
  } catch(e){ msg(friendly(e.message)); }
}

// insert dialog: one field per column, the autoincrement key skipped; an empty field takes the default / NULL
async function addRow(){
  const cols = state.structure.filter(c => !isAutoPk(c));
  const v = await dialog(`Insert a row into ${state.table} (empty = default / NULL)`, cols.map(c => {
    const required = c.notnull && c.dflt_value === null && !c.pk;
    return {key: c.name, label: c.name + (required ? ' (required)' : ''),
            placeholder: (c.type || '') + (c.dflt_value !== null ? ' default ' + c.dflt_value : '')};
  }));
  if (!v) return;
  const names = [], vals = [];
  cols.forEach(c => {
    if (v[c.name] !== ''){
      names.push(`"${c.name}"`);
      vals.push(sqlStr(v[c.name]));
    }
  });
  const sql = names.length
    ? `INSERT INTO "${state.table}" (${names.join(',')}) VALUES (${vals.join(',')})`
    : `INSERT INTO "${state.table}" DEFAULT VALUES`;
  await runWrite(sql);
}

async function addCol(){
  const v = await dialog('Add column', [{key:'spec', label:'column definition (name type [constraints]); types: INTEGER / REAL / TEXT / BLOB',
    placeholder:'e.g. title TEXT NOT NULL / price REAL DEFAULT 0'}]);
  if (!v || !v.spec) return;
  runWrite(`ALTER TABLE "${state.table}" ADD COLUMN ${v.spec}`);
}
window.renameCol = async function(i){
  const col = state.structure[i].name;
  const v = await dialog(`Rename column ${col}`, [{key:'name', label:'new name', value: col}]);
  const nv = v && v.name;
  if (!nv || nv === col) return;
  if (!/^[A-Za-z0-9_-]+$/.test(nv)){ msg('column names: letters, digits, - and _ only'); return; }
  await runWrite(`ALTER TABLE "${state.table}" RENAME COLUMN "${col}" TO "${nv}"`);
};
window.dropCol = async function(i){
  const col = state.structure[i].name;
  if (!await dialog(`Drop column ${col}? Its data goes with it`, [])) return;
  await runWrite(`ALTER TABLE "${state.table}" DROP COLUMN "${col}"`);
};

window.editRow = function(i){
  const tr = document.querySelector(`#grid tr[data-i="${i}"]`);
  const row = state.rows[i];
  tr.innerHTML = state.columns.map((c, j) => j === 0
    ? `<td>${esc(row[0])}</td>`
    : `<td><input data-j="${j}" value="${row[j] === null ? '' : esc(row[j])}" placeholder="NULL"></td>`
  ).join('') + `<td style="white-space:nowrap">
      <button class="btn btn-primary btn-small" onclick="saveRow(${i})">save</button>
      <button class="btn btn-small" onclick="loadRows()">cancel</button></td>`;
  applyWidths($('#grid'));
};
window.saveRow = async function(i){
  const tr = document.querySelector(`#grid tr[data-i="${i}"]`);
  const sets = [];
  tr.querySelectorAll('input').forEach(inp => {
    const j = +inp.dataset.j, old = state.rows[i][j];
    const nv = inp.value === '' ? null : inp.value;
    const changed = (nv === null) !== (old === null) || String(nv) !== String(old);
    if (changed) sets.push(`"${state.columns[j]}" = ${sqlStr(nv)}`);
  });
  if (!sets.length){ loadRows(); return; }
  await runWrite(`UPDATE "${state.table}" SET ${sets.join(', ')} WHERE rowid = ${state.rows[i][0]}`);
};
window.delRow = async function(i){
  if (!await dialog('Delete this row?', [])) return;
  await runWrite(`DELETE FROM "${state.table}" WHERE rowid = ${state.rows[i][0]}`);
};

$('#refresh').onclick = () => loadDbs(state.db).catch(e => msg(friendly(e.message)));
$('#schema').onclick = async () => {  // open / close the structure panel; the rows stay as they are
  if (!state.table) return;
  state.schema = !state.schema;
  if (state.schema && !state.loaded){
    try { await loadStructure(); } catch(e){ state.schema = false; msg(friendly(e.message)); }
  }
  render();
};
$('#dbs').onchange = e => { state.db = e.target.value || null; store.set('db', state.db);
  loadTables().catch(err => msg(friendly(err.message))); };
$('#tables').onchange = e => {  // a table picked by the user: load its rows now
  state.table = e.target.value || null; state.offset = 0; state.loaded = false; state.schema = false;
  store.set('table:' + state.db, state.table);
  loadRows().catch(err => msg(friendly(err.message))); };
$('#newdb').onclick = async () => {
  const v = await dialog('New database', [{key:'name', label:'name (letters, digits, - _)'}]);
  const name = v && v.name;
  if (!name) return;
  try {
    await api('/api/databases', {method:'POST', body: JSON.stringify({name})});
    msg('✓ created database ' + name, true);
    await loadDbs(name);
  } catch(e){ msg(friendly(e.message)); }
};
$('#newtable').onclick = async () => {
  if (!state.db){ msg('pick a database first'); return; }
  const v = await dialog('New table (with an autoincrement id column)', [{key:'name', label:'name (letters, digits, - _)'}]);
  const name = v && v.name;
  if (!name) return;
  if (!/^[A-Za-z0-9_-]+$/.test(name)){ msg('table names: letters, digits, - and _ only'); return; }
  try {
    await api(`/api/db/${state.db}/query`, {method:'POST', body: JSON.stringify(
      {sql: `CREATE TABLE "${name}" (id INTEGER PRIMARY KEY AUTOINCREMENT) STRICT`})});
    msg(`✓ created table ${name} (STRICT, with an autoincrement id); add fields with “+ Add column”`, true);
    await loadTables(name);
    state.schema = true;  // the next step is adding columns
    await loadRows();  // open the table just created
  } catch(e){ msg(friendly(e.message)); }
};
$('#logout').onclick = () => { saveCred(''); msg('signed out; the next action asks for user / password again', true); };

async function runSql(){
  const sql = $('#sql').value.trim();
  if (!state.db){ msg('pick a database first'); return; }
  if (!sql) return;
  logSql(sql);
  try {
    const d = await api(`/api/db/${state.db}/query`, {method:'POST', body: JSON.stringify({sql})});
    const out = $('#sqlout'), t = $('#sqlgrid');
    if (d.columns.length){
      out.hidden = false;
      t.innerHTML = '<thead><tr><th class="rownum">#</th>' + d.columns.map(colTh).join('') + '</tr></thead><tbody>'
        + d.rows.map((r, i) => `<tr><td class="rownum">${i + 1}</td>` + r.map(cell).join('') + '</tr>').join('') + '</tbody>';
      applyWidths(t);
      msg(rowsLine(d), true);
    } else {
      t.innerHTML = ''; out.hidden = true;
      msg(doneLine(d), true);
      loadTables(state.table).catch(e => msg(friendly(e.message)));
    }
  } catch(e){ msg(friendly(e.message)); }
}
$('#run').onclick = runSql;
$('#status').onclick = e => {
  if (e.target.closest('a')) return;
  historyOpen = !historyOpen; store.set('history', historyOpen ? '1' : null); renderLog();
};
$('#sql').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); runSql(); } });

renderLog();
loadDbs().catch(e => msg(friendly(e.message)));
</script>
</body>
